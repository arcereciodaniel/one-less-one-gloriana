name: Validar migración Gloriana
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/migracion-gloriana.test.cjs
