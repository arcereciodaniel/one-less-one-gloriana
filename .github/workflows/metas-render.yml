name: Validar One Less One
on:
  push:
    paths:
      - index.html
      - tests/metas-render.test.cjs
      - tests/movimientos-integrados.test.cjs
      - tests/quincenas-metas-presupuesto.test.cjs
      - tests/formularios-v8.test.cjs
      - .github/workflows/metas-render.yml
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install jsdom@26 --no-save --no-package-lock
      - run: node tests/metas-render.test.cjs
      - run: node tests/movimientos-integrados.test.cjs
      - run: node tests/quincenas-metas-presupuesto.test.cjs
      - run: node tests/formularios-v8.test.cjs
